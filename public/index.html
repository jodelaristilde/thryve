<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thryve.today sign-up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  main { width: 100%; max-width: 460px; }
  .card { padding: 36px 32px 28px; }
  h1 { font-weight: 800; font-size: clamp(1.8rem, 6vw, 2.3rem); line-height: 1.1; margin: 0 0 8px; }
  .lede { margin: 0 0 28px; color: var(--muted); line-height: 1.5; }
  .logo { display: block; width: 84px; height: 84px; margin: 0 auto 18px; }
  .field { margin-bottom: 18px; }
  .btn.full { width: 100%; margin-top: 6px; min-height: 50px; }
  .slogan {
    font-family: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 600; text-align: center; margin: 28px 0 0; padding-top: 20px;
    border-top: 3px solid var(--sun); font-size: 1.15rem;
  }
  .done { text-align: center; padding: 12px 0; }
  .done h2 { margin: 0 0 8px; }
  .done p { color: var(--muted); margin: 0; }
  .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Thryve.Today Training Center" width="84" height="84">
    <div id="formView">
      <h1>Thank You for your interest in Thryve.Today</h1>
      <p class="lede">Tell us a little about you and the course you want to start with.</p>

      <form id="signup" novalidate onsubmit="return false">
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
          <p class="error" id="e-name" hidden></p>
        </div>

        <div class="field">
          <label for="tel">Telephone</label>
          <input id="tel" name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 123-4567" required>
          <p class="error" id="e-tel" hidden></p>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <p class="error" id="e-email" hidden></p>
        </div>

        <div class="field">
          <label for="course">Course interested in</label>
          <select id="course" name="course" required>
